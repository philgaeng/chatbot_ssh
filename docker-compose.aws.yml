services:
  nginx:
    ports:
      # ⚠ **Deliberately literal, unlike the five ports QA-03 parameterised.** These are the
      # real host's real ports on a public interface: nothing reaches the site except on 80
      # and 443, and TLS certificates are issued against them. Moving them would not isolate
      # a second stack, it would take the site off the internet. Running a second stack on
      # the staging host is ruled out anyway — it has 3825 MB and no swap (DESIGN §3).
      - "80:80"
      - "443:443"
    volumes:
      # Named conf file (not default.conf) — base compose entrypoint removes default.conf;
      # binding AWS config as default.conf makes rm fail and nginx crash-loops.
      - ./deployment/nginx/webchat_rest_compose_aws.conf:/etc/nginx/conf.d/webchat_rest_compose_aws.conf:ro
      - ./channels/REST_webchat:/app/channels/REST_webchat:ro
      - ./channels/shared:/app/channels/shared:ro
      - ./deployment/certbot/www:/var/www/certbot:ro
      - ./deployment/certbot/conf:/etc/letsencrypt:ro
