[pytest]
markers =
    integration: tests that require a live Postgres DB with ticketing seed data
    live_llm: tests that make a REAL call to the configured LLM provider — they cost money and depend on a third party

# The `integration` marker declares a DEPENDENCY, not a quarantine. CI runs these tests
# (.github/workflows/ci.yml seeds the DB precisely so it can) — do not add
# `-m "not integration"` to silence a red build. Between 2026-07 and T3-08 they were
# deselected in CI, and test_officer_assignment.py rotted unnoticed as a result (D-44).
#
# What they need: all three Alembic streams migrated, then
#   python -m ticketing.seed.import_locations_json ...   (see ci.yml)
#   python -m ticketing.seed.mock_tickets --reset
# The `--reset` matters. Officer assignment ranks by active ticket load, so a DB that has
# accumulated tickets can assign a different (still correct) officer than a fresh seed —
# tests must therefore assert on the candidate *pool*, never on one officer's identity.
#
# Host pytest: pip install -r requirements.grm.txt && make test-ticketing-host
# (DB on localhost:${POSTGRES_HOST_PORT:-5433} — see docker-compose.grm.yml db.ports)
# DB credentials come from compose, never env.local — tests/ticketing/_host_env.py (D-36).
# Container pytest (preferred CI parity): make test-ticketing

# ── `live_llm` (DPG-24, 2026-08-20) ──────────────────────────────────────────
# Like `integration`, this declares a DEPENDENCY and is NOT a quarantine. The dependency is a
# funded API key and a live third-party provider.
#
# Where each marker runs, and why the split is not the pattern T3-08 dismantled:
#
#   backend-tests               `-m "not live_llm"`   fast, hermetic, blocking, no network, no cost
#   dpg-platform-independence   `-m live_llm`         every commit, real calls, NEVER a required check
#
# ⚠ A marker that nothing ever runs is exactly what T3-08 removed. `live_llm` runs on **every
# commit** in the fifth CI job — the deselection above exists so that `backend-tests` stays free and
# offline, not so that these tests stop running. If you ever find yourself deselecting `live_llm`
# in BOTH places, you have re-created the quarantine; delete the tests instead, so the absence is
# visible.
#
# Why it is never a required status check (Q-17): the job calls a live third-party API, so provider
# outages redden it by construction, and a gate that blocks merges on someone else's uptime gets
# routed around within a week. The reason is repeated in the job header, where the next person will
# read it before "fixing" the job by making it required.
#
# Running them locally — costs real inference, so it is deliberate, never a default:
#   docker compose --env-file env.local -f docker-compose.yml -f docker-compose.grm.yml \
#     run --rm --no-deps -v "$PWD:/app" -w /app \
#     -e LLM_BASE_URL=https://router.huggingface.co/v1 -e LLM_API_KEY="$HF_TOKEN" \
#     backend python -m pytest tests/backend/test_llm_live.py -m live_llm -v
