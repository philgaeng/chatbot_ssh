[pytest]
markers =
    integration: tests that require a live Postgres DB with ticketing seed data

# The `integration` marker declares a DEPENDENCY, not a quarantine. CI runs these tests
# (.github/workflows/ci.yml seeds the DB precisely so it can) — do not add
# `-m "not integration"` to silence a red build. Between 2026-07 and T3-08 they were
# deselected in CI, and test_officer_assignment.py rotted unnoticed as a result (D-44).
#
# What they need: all three Alembic streams migrated, then
#   python -m ticketing.seed.import_locations_json ...   (see ci.yml)
#   python -m ticketing.seed.mock_tickets --reset
# The `--reset` matters. Officer assignment ranks by active ticket load, so a DB that has
# accumulated tickets can assign a different (still correct) officer than a fresh seed —
# tests must therefore assert on the candidate *pool*, never on one officer's identity.
#
# Host pytest: pip install -r requirements.grm.txt && make test-ticketing-host
# (DB on localhost:${POSTGRES_HOST_PORT:-5433} — see docker-compose.grm.yml db.ports)
# DB credentials come from compose, never env.local — tests/ticketing/_host_env.py (D-36).
# Container pytest (preferred CI parity): make test-ticketing
