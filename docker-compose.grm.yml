# GRM Ticketing — Docker Compose overlay
#
# ── One stack (CL-03) ─────────────────────────────────────────────────────────
# Exactly one officer UI (grm_ui :3001) + one ticketing API (ticketing_api :5002).
# The auth mode is a CONFIG flag, not a duplicate service:
#   - Dev bypass:  APP_ENV=dev AUTH_MODE=bypass  (env.local) → mock super-admin,
#                  no Keycloak needed.  `make wsl-up`
#   - Real OIDC:   APP_ENV=staging|production AUTH_MODE=keycloak + KEYCLOAK_ISSUER →
#                  Keycloak JWT. Bring up Keycloak with `--profile auth`. `make wsl-auth`
#
# Production can never bypass (fail-closed, HR-01): AUTH_MODE=bypass is honoured
# only when APP_ENV=dev — otherwise the API refuses to start without KEYCLOAK_ISSUER
# + TICKETING_SECRET_KEY.
#
# ── Keycloak (--profile auth) ─────────────────────────────────────────────────
#   → keycloak :18080 admin UI (admin / ${KEYCLOAK_ADMIN_PASSWORD})
#     Host port configurable via KEYCLOAK_HOST_PORT. Browser-facing URL pinned by
#     KC_HOSTNAME_URL so tokens' `iss` claim matches what the UI uses for login.
#
# After first start with auth profile, set SMTP_* in env.local, then initialise realm:
#   docker compose -f docker-compose.yml -f docker-compose.grm.yml --profile auth \
#     exec ticketing_api python -m ticketing.auth.keycloak_setup
#
# Run alongside the existing stack:
#   docker compose -f docker-compose.yml -f docker-compose.grm.yml up -d
#
# One-shot migration:
#   python -m alembic -c ticketing/migrations/alembic.ini upgrade head
#
# One-shot seed:
#   python -m ticketing.seed.mock_tickets

# Bounded container logs (same policy as base compose) — see
# docs/services/12_security_monitoring_service.md §3 item 7.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── Keycloak (OIDC identity provider) — auth profile only ───────────────────
  # Included only when: docker compose --profile auth up
  # Admin UI: http://localhost:${KEYCLOAK_HOST_PORT:-18080}/  (admin / KEYCLOAK_ADMIN_PASSWORD)
  # Default host port is 18080 to avoid clashing with nginx on host :8080.
  # Uses existing db container — stores state in the 'keycloak' schema in app_db.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev
    volumes:
      - ./deployment/keycloak/themes/grm:/opt/keycloak/themes/grm:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      # Canonical browser-facing URL — bakes into tokens' `iss` claim and the
      # discovery endpoint. Backend reaches Keycloak via Docker DNS instead
      # (see KEYCLOAK_JWKS_URL in ticketing_api).
      #   Pattern A (local direct ports): http://localhost:18080
      #   Pattern B (EC2 nginx subdomain): https://grm-auth.<host>/keycloak
      # KC_HOSTNAME is the v2 hostname option (KC 26+). The deprecated
      # KC_HOSTNAME_URL would print a warning and is being removed in 27.
      KC_HOSTNAME: ${KC_HOSTNAME_URL:-http://localhost:18080}
      # Trust X-Forwarded-* from nginx so KC issues HTTPS URLs (matching
      # KC_HOSTNAME's scheme) when traffic arrives over plaintext from the
      # internal Docker network. Without this, Pattern B's discovery doc
      # returns http:// URLs even though KC_HOSTNAME starts with https://,
      # which breaks browser-side OIDC (mixed content) and JWT iss-claim
      # validation on the backend.
      KC_PROXY_HEADERS: xforwarded
      # Path prefix Keycloak expects in incoming requests. Empty = root.
      # Set to /keycloak on EC2 (Pattern B) so KC and nginx agree on the
      # subpath. MUST match the path in KC_HOSTNAME.
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Event → ticketing: use an HTTP Keycloak event-listener extension to POST
      # UPDATE_PASSWORD events to http://ticketing_api:5002/api/v1/webhooks/keycloak
      # with header X-Keycloak-Webhook-Secret: ${KEYCLOAK_WEBHOOK_SECRET}.
    ports:
      - "${KEYCLOAK_HOST_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Keycloak 26 exposes /health/ready on the management port (9000), not 8080.
      # Quarkus management interface starts only when KC_HEALTH_ENABLED=true.
      # KC_HTTP_RELATIVE_PATH (set on the service env) shifts the path prefix —
      # in Pattern A it's "/" (no prefix), in Pattern B "/keycloak". `$$VAR`
      # defers expansion to the container's shell at runtime instead of compose
      # render time. The `%/` strips a trailing slash so Pattern A becomes "".
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET %s/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' \"$${KC_HTTP_RELATIVE_PATH%/}\" >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ── Postgres host port (for host-side pytest / psql — containers still use db:5432) ──
  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  # ── Backend API port override (base docker-compose.yml has no host port mapping) ──
  # This overlay exposes port 5001 so the host browser can reach /api/grievance/*.
  # The ticketing_api service also overrides BACKEND_GRIEVANCE_BASE_URL to use the
  # Docker service name (http://backend:5001) rather than localhost.
  #
  # ⚠ The 127.0.0.1: prefix is load-bearing, not style (GRM-065). Every deploy stack
  # includes this file — COMPOSE_AWS and the prod path both — and neither overlay
  # overrides `ports`, so a bare "5001:5001" publishes a dev convenience on the public
  # interface of staging AND production. Measured 2026-09-06 from outside both hosts:
  # DOR prod filtered 8000/5001/5002, but AWS staging answered on :8000 with the
  # orchestrator's uvicorn, /docs and /openapi.json — reachable by anyone.
  # Nothing needs the published port: nginx reaches these services by Docker service
  # name over the internal network (deployment/nginx/webchat_rest_compose_*.conf).
  backend:
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5001}:5001"

  # ── Orchestrator port override (same pattern — loopback only; see GRM-065 above) ──
  orchestrator:
    ports:
      - "127.0.0.1:${ORCHESTRATOR_HOST_PORT:-8000}:8000"

  # ── Ticketing API (FastAPI, port 5002) — the single consolidated API ──────────
  # Auth mode is env-driven (APP_ENV / AUTH_MODE), not a duplicate service:
  #   dev bypass  → APP_ENV=dev AUTH_MODE=bypass (env.local); Keycloak vars ignored.
  #   real OIDC   → AUTH_MODE=keycloak + KEYCLOAK_ISSUER; run keycloak (--profile auth).
  # Chatbot ticket-intake target (x-api-key webhook) — verify_api_key is independent
  # of the auth mode, so the webhook works in both bypass and keycloak.
  ticketing_api:
    image: ${IMAGE_REGISTRY:-ghcr.io/philgaeng/chatbot_ssh}/app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn ticketing.api.main:app --host 0.0.0.0 --port 5002
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - env.local
    environment:
      TICKETING_PORT: "5002"
      # Canonical env + auth mode (defaults are the secure production posture).
      APP_ENV: ${APP_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Use Docker service names for internal calls (not localhost)
      BACKEND_GRIEVANCE_BASE_URL: http://backend:5001
      ORCHESTRATOR_BASE_URL: http://orchestrator:8000
      # Override to use the Docker db service (user/password/app_db)
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
      # Keycloak (used only when AUTH_MODE=keycloak; ignored under dev bypass).
      # KEYCLOAK_ISSUER = browser-facing `iss`; JWKS fetched internally via Docker DNS.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:18080/realms/grm}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/grm/protocol/openid-connect/certs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ticketing-api}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:-}
      TICKETING_TEST_IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # fallback if issuer uses localhost
    ports:
      - "${TICKETING_API_HOST_PORT:-5002}:5002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5002/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── GRM Celery worker (SLA watchdog + grievance sync + notifications) ─────────
  grm_celery:
    image: ${IMAGE_REGISTRY:-ghcr.io/philgaeng/chatbot_ssh}/app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery
      -A ticketing.tasks.celery_app.celery_app
      worker
      -Q grm_ticketing,grm_geocode
      --loglevel=info
      --concurrency=2
      --without-gossip --without-mingle --without-heartbeat
    env_file:
      - env.local
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A ticketing.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  # ── GRM Celery Beat (periodic task scheduler) ─────────────────────────────────
  grm_celery_beat:
    image: ${IMAGE_REGISTRY:-ghcr.io/philgaeng/chatbot_ssh}/app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery
      -A ticketing.tasks.celery_app.celery_app
      beat
      --loglevel=info
      --schedule /tmp/grm_celerybeat-schedule
    env_file:
      - env.local
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
    depends_on:
      - grm_celery
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Beat rewrites its schedule shelve on every tick (heartbeat runs every 60s),
      # so a fresh mtime means beat is alive.
      test: ["CMD-SHELL", "find /tmp/grm_celerybeat-schedule* -mmin -5 | grep -q . || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Ops monitor — platform health/backup/security/report (broker-independent) ─
  # APScheduler in-process (NOT Celery): survives a Redis/worker outage. Connects
  # to Postgres as the scoped ops_app role (read/write ops.*, read-only reporting
  # tables). NO Docker socket — container supervision is the host watchdog's job.
  # Spec: docs/services/11_health_and_monitoring_service.md
  ops:
    image: ${IMAGE_REGISTRY:-ghcr.io/philgaeng/chatbot_ssh}/app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ops.scheduler
    env_file:
      - env.local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?}
      # Admin creds (used only if OPS_DB_* unset; ops_app is the runtime role).
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Scoped least-privilege role created by ops001 migration.
      OPS_DB_USER: ${OPS_DB_USER:-ops_app}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      MESSAGING_API_URL: http://backend:5001
      HEALTH_ALERT_EMAIL: ${HEALTH_ALERT_EMAIL:-}
      DAILY_REPORT_EMAIL: ${DAILY_REPORT_EMAIL:-}
      DAILY_REPORT_TZ: ${DAILY_REPORT_TZ:-Asia/Kathmandu}
      # healthchecks.io ping URL (dead-man's switch). HEARTBEAT_URL is canonical;
      # STRATCON_HEARTBEAT_URL / HEALTHCHECKS_PING_URL accepted as aliases. NOT UptimeRobot.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-${STRATCON_HEARTBEAT_URL:-${HEALTHCHECKS_PING_URL:-}}}
      PYTHONPATH: /app
    volumes:
      - backups_data:/var/backups/grms
    mem_limit: 192m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -m ops.selfcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── GRM Ticketing UI (port 3001) — the single officer UI ─────────────────────
  # Auth mode is baked at BUILD time (NEXT_PUBLIC_* are inlined by the compiler),
  # derived from the canonical AUTH_MODE / KEYCLOAK_ISSUER (CL-03):
  #   dev bypass → AUTH_MODE=bypass, KEYCLOAK_ISSUER="" → "Continue to demo queue".
  #   real OIDC  → AUTH_MODE=keycloak + browser-facing KEYCLOAK_ISSUER → email+password.
  # Rebuild (`--build`) after changing AUTH_MODE/KEYCLOAK_ISSUER. All API calls are
  # proxied server-side (Next.js) to TICKETING_API_URL — browser only uses :3001.
  grm_ui:
    # ⚠ **Its own tag variable, and it is not decoration** (Q-17). The UI is the one image with
    # two variants of the *same* commit — `ui:<sha>` (keycloak, deployable) and `ui:<sha>-bypass`
    # (test only) — because NEXT_PUBLIC_AUTH_MODE is inlined at build time. A single shared
    # IMAGE_TAG can only ever name one of them, so the e2e stack could not run `ui:<sha>-bypass`
    # beside `app:<sha>`. Defaulting UI_IMAGE_TAG to IMAGE_TAG leaves every existing invocation
    # unchanged; the e2e job sets it and nothing else moves.
    image: ${IMAGE_REGISTRY:-ghcr.io/philgaeng/chatbot_ssh}/ui:${UI_IMAGE_TAG:-${IMAGE_TAG:-local}}
    build:
      context: ./channels/ticketing-ui
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_AUTH_MODE mirrors AUTH_MODE; NEXT_PUBLIC_OIDC_ISSUER mirrors
        # KEYCLOAK_ISSUER (one source — no separate hand-kept frontend issuer var).
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-keycloak}
        NEXT_PUBLIC_OIDC_ISSUER: ${KEYCLOAK_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ticketing-ui}
        NEXT_PUBLIC_REDIRECT_SIGN_IN: ${NEXT_PUBLIC_REDIRECT_SIGN_IN:-}
        NEXT_PUBLIC_REDIRECT_SIGN_OUT: ${NEXT_PUBLIC_REDIRECT_SIGN_OUT:-}
    environment:
      # Server-side proxy target — uses Docker service name (not localhost)
      TICKETING_API_URL: ${TICKETING_API_URL:-http://ticketing_api:5002}
    ports:
      - "${GRM_UI_HOST_PORT:-3001}:3001"
    depends_on:
      - ticketing_api
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
