# AWS Compose — HTTP redirect + HTTPS. Same DNS re-resolution pattern as WSL compose.

# ── Rate limiting (http context) — abuse protection for public surfaces ──────
# Mirrors webchat_rest_compose_prod.tls.conf; docs/services/12_security_monitoring_service.md §3 item 6.
#   public  : chatbot /message (LLM-cost guard)
#   uploads : file/voice upload (disk-exhaustion guard)
# ⚠ Added 2026-09-06 (GRM-014). Staging had NO rate limiting on /message while prod
# had it, and /message is public by design on both — the webchat calls it unauthenticated.
limit_req_zone  $binary_remote_addr zone=public:10m  rate=30r/m;
limit_req_zone  $binary_remote_addr zone=uploads:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;

server {
    listen 80;
    # Replace/add hostnames for your deployment.
    server_name nepal-gms-chatbot.facets-ai.com 52.76.171.73 localhost 127.0.0.1;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $orchestrator_host orchestrator;
    set $grm_ui_host grm_ui;
    set $ticketing_api_host ticketing_api;

    # ACME challenge path used by certbot renew --webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        proxy_pass http://$orchestrator_host:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all HTTP traffic to HTTPS once certs are in place.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nepal-gms-chatbot.facets-ai.com 52.76.171.73 localhost 127.0.0.1;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $orchestrator_host orchestrator;
    set $backend_host backend;
    set $grm_ui_host grm_ui;
    set $ticketing_api_host ticketing_api;

    # Keycloak upstream — OIDC discovery/login served on the main domain.
    set $keycloak_host keycloak;

    ssl_certificate /etc/letsencrypt/live/nepal-gms-chatbot.facets-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nepal-gms-chatbot.facets-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    # ── Security headers — ported from webchat_rest_compose_prod.tls.conf (GRM-067, 2026-09-14) ──
    # Staging had none of these and advertised its nginx version; prod has carried them all along.
    #
    # ⚠ nginx INHERITANCE: a location that declares any add_header of its own inherits NONE of
    # these. That is deliberate for /keycloak/ (see there) and for /message, which sets its own CORS
    # origin — the same shape prod has.
    #
    # ⚠ HSTS is sticky in browsers for max-age. Keep this host on HTTPS; certbot already renews it.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Officer attachments, chatbot uploads, location imports (default nginx limit is 1m).
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect bare HTTPS root to webchat entrypoint.
    location = / {
        return 302 /rest-webchat/;
    }

    location /rest-webchat/ {
        alias /app/channels/REST_webchat/;
        index index.html;
    }

    location /shared/ {
        alias /app/channels/shared/;
        try_files $uri $uri/ =404;
    }

    # Keycloak OIDC (Pattern B path prefix — matches KC_HTTP_RELATIVE_PATH=/keycloak).
    location /keycloak/ {
        # ⚠ Stops this location inheriting the server-level security headers (GRM-067). Keycloak sends a
        # complete, STRICTER set of its own — measured 2026-09-14: Referrer-Policy no-referrer, CSP
        # frame-ancestors 'self', HSTS, nosniff, X-Frame-Options SAMEORIGIN. Inheriting ours would
        # append `Referrer-Policy: strict-origin-when-cross-origin`, and browsers honour the LAST value —
        # silently weakening the login pages, whose URLs carry codes and state.
        # Any add_header in a location stops inheritance; this one carries no security meaning and
        # duplicates nothing Keycloak sends. `add_header_inherit off` would be cleaner, but it is
        # unknown to nginx 1.28 (the local nginx:stable) and nginx refuses to start on it.
        add_header X-GRM-Upstream "keycloak";
        proxy_pass http://$keycloak_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
    }

    # Next.js static/runtime assets must resolve from the UI upstream.
    location /_next/ {
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /message {
        limit_req zone=public burst=10 nodelay;
        limit_conn conns 20;
        proxy_pass http://$orchestrator_host:8000/message;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same-origin webchat is served from this host; restrict CORS to it.
        # Was `*` until 2026-09-06 — any page could drive a complainant session
        # from a visitor's browser, unauthenticated and unthrottled (GRM-014).
        add_header Access-Control-Allow-Origin https://nepal-gms-chatbot.facets-ai.com;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    location ~* ^/accessible-socket\.io/ {
        proxy_pass http://$backend_host:5001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location = /accessible-socket.io {
        proxy_pass http://$backend_host:5001/accessible-socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location /upload-files {
        limit_req zone=uploads burst=5 nodelay;
        limit_conn conns 10;
        proxy_pass http://$backend_host:5001/upload-files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location /upload-voice-chunk {
        limit_req zone=uploads burst=10 nodelay;
        limit_conn conns 10;
        proxy_pass http://$backend_host:5001/upload-voice-chunk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2M;
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
        proxy_send_timeout 120;
    }

    location /upload-voice-complete {
        proxy_pass http://$backend_host:5001/upload-voice-complete;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
        proxy_send_timeout 120;
    }

    location /files/ {
        proxy_pass http://$backend_host:5001/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location ~ ^/file-status/(.+)$ {
        # Preserve file_id explicitly to avoid URI truncation in upstream requests.
        proxy_pass http://$backend_host:5001/file-status/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_connect_timeout 10;
        proxy_send_timeout 30;
    }

    location /task-status/ {
        proxy_pass http://$backend_host:5001/task-status/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GRM Ticketing API calls from the browser (absolute /api/v1/... paths).
    location /api/v1/ {
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Direct mobile routes from Next.js (e.g., /m, /m/queue, /m/tickets/*).
    # Handle both /m and /m/... directly to avoid /m <-> /m/ redirect loops.
    location = /m {
        proxy_pass http://$grm_ui_host:3001/m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /m/ {
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Mobile UA redirect for the UI entrypoints only.
    # Keep APIs untouched and allow explicit desktop override via ?view=desktop.
    location = /grm/ {
        if ($arg_view = desktop) {
            return 302 /grm/;
        }
        if ($http_user_agent ~* "(android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile)") {
            return 302 /grm/m/;
        }
        rewrite ^/grm/?(.*)$ /$1 break;
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /ticketing/ {
        if ($arg_view = desktop) {
            return 302 /ticketing/;
        }
        if ($http_user_agent ~* "(android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile)") {
            return 302 /ticketing/m/;
        }
        rewrite ^/ticketing/?(.*)$ /$1 break;
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # GRM Ticketing UI — all sub-paths.
    location /grm/ {
        rewrite ^/grm/?(.*)$ /$1 break;
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Ticketing UI (alias path) exposed on :3001 upstream
    location /ticketing/ {
        rewrite ^/ticketing/?(.*)$ /$1 break;
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Root-level ticketing routes (app redirects may land here). Keep in sync with the app's
    # top-level routes (channels/ticketing-ui/app/*) and the prod config's allowlist —
    # qr-codes / account were added to the app but missing here, so they 404'd on staging.
    location ~ ^/(queue|tickets|escalated|reports|settings|help|login|auth|qr-codes|account|closure)(/.*)?$ {
        proxy_pass http://$grm_ui_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # GRM Ticketing API served under /grm-api/
    location /grm-api/ {
        rewrite ^/grm-api/?(.*)$ /$1 break;
        proxy_pass http://$ticketing_api_host:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20M;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Ticketing mobile/API alias path exposed on :5001 upstream
    location /ticketing-mobile/ {
        rewrite ^/ticketing-mobile/?(.*)$ /$1 break;
        proxy_pass http://$backend_host:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── No site-wide CORS here — REMOVED 2026-09-14 (GRM-067 / GRM-104) ──
    # This used to add `Access-Control-Allow-Origin * always` to every location. It enabled nothing and
    # broke things, measured:
    #   * every upstream that genuinely needs CORS already sets its own — Keycloak (per client Web
    #     Origins), the ticketing API — so this only ever DUPLICATED them: `grm-auth…, *` on /keycloak/,
    #     `*, *` on /api/v1/auth/login. Browsers reject a response with two ACAO values.
    #   * our own pages call only their own origin (webchat JS: no foreign API host; officer UI: none
    #     hardcoded; sign-in, renewal and sign-out are all same-origin since GRM-104).
    #   * nothing external calls staging: 52 /message requests in 14 days were same-origin or a scanner.
    # ⚠ Staging has TWO origins (the apex and grm-auth.), which is why copying prod's single-origin
    # value would still have produced duplicates. /message keeps its explicit origin — the
    # orchestrator adds none of its own.
}
