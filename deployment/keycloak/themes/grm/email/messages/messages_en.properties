# Officer setup email (Keycloak execute-actions), GRM-133.
# Keycloak's default ("Update Your Account", "Your administrator has just requested that you update
# your account...") reads like a password-phishing email and was filed as spam on staging.
# Written for officers reading English as a second language: docs/ticketing_system/ui/05_ui_copy_style.md.
# Parameters: {0} link · {2} realm display name · {4} how long the link works (e.g. "7 days").
executeActionsSubject=Set your password for GRM Ticketing
executeActionsBody=An account has been created for you in {2}, the grievance system for officers.\n\nTo start, set your password with this link:\n\n{0}\n\nThe link works for {4}. If it no longer works, ask your GRM administrator to send a new one.\n\nIf you were not expecting this email, you can ignore it. Nothing changes unless the link is used.
executeActionsBodyHtml=<p>An account has been created for you in {2}, the grievance system for officers.</p><p>To start, set your password with this link:</p><p><a href="{0}">Set my password</a></p><p>The link works for {4}. If it no longer works, ask your GRM administrator to send a new one.</p><p>If you were not expecting this email, you can ignore it. Nothing changes unless the link is used.</p>
